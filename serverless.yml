service: fsm-ordenes
frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    ORDENES_TABLE: ${self:custom.tablaOrdenes}
    SNS_TOPIC_ARN: !Ref TopicoEventosFSM
    USUARIOS_VALIDAR_LAMBDA: ${self:custom.validadorToken}

custom:
  tablaOrdenes: fsm-${sls:stage}-ordenes
  topicoEventos: fsm-${sls:stage}-eventos
  colaVisitas: fsm-${sls:stage}-cola-visitas
  colaFacturacion: fsm-${sls:stage}-cola-facturacion
  validadorToken: fsm-${sls:stage}-validar-token

functions:
  crearOrden:
    handler: src/handler.crear_orden
    events:
      - http:
          path: ordenes
          method: post
          cors: true
  listarOrdenes:
    handler: src/handler.listar_ordenes
    events:
      - http:
          path: ordenes
          method: get
          cors: true
  obtenerOrden:
    handler: src/handler.obtener_orden
    events:
      - http:
          path: ordenes/{orden_id}
          method: get
          cors: true

resources:
  Resources:
    TablaOrdenes:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tablaOrdenes}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: orden_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: orden_id
            KeyType: RANGE

    TopicoEventosFSM:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:custom.topicoEventos}

    ColaVisitas:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.colaVisitas}

    ColaFacturacion:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.colaFacturacion}

    SuscripcionVisitas:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint: !GetAtt ColaVisitas.Arn
        TopicArn: !Ref TopicoEventosFSM
        FilterPolicy:
          evento: ["orden.creada"]

    SuscripcionFacturacion:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint: !GetAtt ColaFacturacion.Arn
        TopicArn: !Ref TopicoEventosFSM
        FilterPolicy:
          evento: ["orden.creada", "visita.completada"]

    ColaVisitasPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaVisitas
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: sqs:SendMessage
              Resource: !GetAtt ColaVisitas.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref TopicoEventosFSM

    ColaFacturacionPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaFacturacion
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: sqs:SendMessage
              Resource: !GetAtt ColaFacturacion.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref TopicoEventosFSM

package:
  patterns:
    - '!tests/**'
    - '!scripts/**'
    - '!package.json'
    - '!package-lock.json'
    - '!node_modules/**'
    - '!README.md'
    - '!.gitignore'
