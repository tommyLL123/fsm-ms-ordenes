service: fsm-ms-ordenes
frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.10
  stage: dev
  region: us-east-1
  # Uso estricto del LabRole para AWS Academy Learner Lab
  role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    ORDENES_TABLE: ${self:custom.tableName}
    SNS_TOPIC_ARN: !Ref TopicoEventosFSM
    USUARIOS_VALIDAR_LAMBDA: fms-ms-usuarios-dev-validar-token # Ajusta al nombre real de la lambda A

custom:
  tableName: fsm-ordenes-${self:provider.stage}

functions:
  crearOrden:
    handler: handler.crear_orden
    events:
      - http:
          path: /ordenes
          method: post
          cors: true
  listarOrdenes:
    handler: handler.listar_ordenes
    events:
      - http:
          path: /ordenes
          method: get
          cors: true

resources:
  Resources:
    # Tabla DynamoDB
    OrdenesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: orden_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: orden_id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    # Tópico SNS (Responsabilidad de C)
    TopicoEventosFSM:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: fsm-eventos-topic-${self:provider.stage}

    # Colas SQS (Visitas y Facturación)
    ColaVisitas:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: fsm-cola-visitas-${self:provider.stage}

    ColaFacturacion:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: fsm-cola-facturacion-${self:provider.stage}

    # Suscripciones de SNS a SQS
    SuscripcionVisitas:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint: !GetAtt ColaVisitas.Arn
        TopicArn: !Ref TopicoEventosFSM
        FilterPolicy:
          evento: ["orden.creada"]

    SuscripcionFacturacion:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint: !GetAtt ColaFacturacion.Arn
        TopicArn: !Ref TopicoEventosFSM
        FilterPolicy:
          evento: ["orden.creada", "visita.completada"] # Facturación requiere estos eventos

    # Permisos vitales para que SNS escriba en las colas
    ColaVisitasPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaVisitas
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: sqs:SendMessage
              Resource: !GetAtt ColaVisitas.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref TopicoEventosFSM

    ColaFacturacionPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaFacturacion
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: sqs:SendMessage
              Resource: !GetAtt ColaFacturacion.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref TopicoEventosFSM
