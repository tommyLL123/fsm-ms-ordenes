service: fsm-ordenes
frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    ORDENES_TABLE: ${self:custom.tablaOrdenes}
    SNS_TOPIC_ARN: !Ref TopicoEventosFSM
    USUARIOS_VALIDAR_LAMBDA: ${self:custom.validadorToken}

custom:
  tablaOrdenes: fsm-${sls:stage}-ordenes
  # ¡Nombres sincronizados exactamente con MS-D y MS-E!
  topicoEventos: fsm-${sls:stage}-eventos
  colaVisitas: fsm-${sls:stage}-cola-visitas
  colaFacturacion: fsm-${sls:stage}-cola-facturacion
  validadorToken: fsm-${sls:stage}-validar-token 

functions:
  crearOrden:
    handler: handler.crear_orden
    events:
      - http:
          path: ordenes
          method: post
          cors: true
  listarOrdenes:
    handler: handler.listar_ordenes
    events:
      - http:
          path: ordenes
          method: get
          cors: true

resources:
  Resources:
    # 1. Tabla DynamoDB de Órdenes
    TablaOrdenes:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tablaOrdenes}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: orden_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: orden_id
            KeyType: RANGE

    # 2. Tópico SNS (MS-D también publicará aquí)
    TopicoEventosFSM:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:custom.topicoEventos}

    # 3. Cola SQS para MS-D (Visitas)
    ColaVisitas:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.colaVisitas}

    # 4. Cola SQS para MS-E (Facturación)
    ColaFacturacion:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.colaFacturacion}

    # 5. Suscripción SNS -> SQS Cola Visitas (Filtra eventos orden.creada)
    SuscripcionVisitas:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint: !GetAtt ColaVisitas.Arn
        TopicArn: !Ref TopicoEventosFSM
        FilterPolicy:
          evento: ["orden.creada"]

    # 6. Suscripción SNS -> SQS Cola Facturación (Filtra eventos orden.creada y visita.completada)
    SuscripcionFacturacion:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        Endpoint: !GetAtt ColaFacturacion.Arn
        TopicArn: !Ref TopicoEventosFSM
        FilterPolicy:
          evento: ["orden.creada", "visita.completada"]

    # 7. Permisos para que SNS pueda escribir en Cola Visitas
    ColaVisitasPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaVisitas
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: sqs:SendMessage
              Resource: !GetAtt ColaVisitas.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref TopicoEventosFSM

    # 8. Permisos para que SNS pueda escribir en Cola Facturación
    ColaFacturacionPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaFacturacion
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: sqs:SendMessage
              Resource: !GetAtt ColaFacturacion.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref TopicoEventosFSM

package:
  patterns:
    - '!tests/**'
    - '!README.md'
    - '!.gitignore'
